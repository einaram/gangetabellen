<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regning</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .start-screen {
            margin-top: 50px; background: white; padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); width: 300px; margin-left: auto; margin-right: auto;
        }
        h1 { color: #333; }
        .op {
            display: inline-block; width: 60px; height: 60px; line-height: 60px; margin: 5px;
            font-size: 32px; text-decoration: none; color: #28a745; border: 2px solid #28a745;
            border-radius: 10px; background: white;
        }
        .op:hover { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="start-screen">
        <h1>Velg regneart</h1>
        <a class="op" href="add.html" title="Addisjon">+</a>
        <a class="op" href="subtract.html" title="Subtraksjon">−</a>
        <a class="op" href="multiply.html" title="Gangetabellen">×</a>
        <a class="op" href="divide.html" title="Divisjon">÷</a>
    </div>
</body>
</html>
